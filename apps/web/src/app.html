<!doctype html>
<html lang="en">
	<head>
		<title>repose</title>
		<meta charset="utf-8" />
		<!-- ?v= makes browsers drop the r-mark they cached (DECISIONS I-363). -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=2" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=2" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The app renders in the browser (ssr = false), so until the bundle's
		     CSS arrives the page would paint the browser's default white, and a
		     dark-mode visitor sees a white flash. These match --page in
		     routes/layout.css so the first paint is already the right colour. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
		<style>
			html {
				background: #fbfbfa;
				color: #181817;
			}
			@media (prefers-color-scheme: dark) {
				html {
					background: #111110;
					color: #f3f3f1;
				}
			}
			/* The route renders as soon as its script runs, which can be
			   before its stylesheet has loaded. Hidden until routes/layout.css
			   sets visibility back, so nothing paints unstyled. */
			body {
				visibility: hidden;
			}
		</style>
		<!-- The fonts are self-hosted (static/fonts, @font-face in
		     routes/layout.css). The two heading cuts are fetched before the CSS
		     that names them arrives: 700 is the landing's headline, 600 every
		     dashboard title. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/noto-serif-latin-700-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/noto-serif-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
