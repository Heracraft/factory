# The checks docs/CHECKLIST.md asks for, on every push to main and every
# pull request. VM tests under nix/ need KVM, which hosted runners lack, so
# the Nix job evaluates every output without building; the VM tests run on
# the dev box and on hosts (docs/ops/DEV-BOX.md).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go build, vet, test, lint
    runs-on: ubuntu-latest
    # The api's integration tests run against a real Postgres
    # (docs/workstreams/05-control-plane-api.md §7).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # Rollback is exercised on a seeded database: migrate, seed, down 1, up.
      - name: repose-admin db migrate --down 1 on a seeded database
        run: |
          go run ./cmd/repose-admin db migrate
          psql "$DATABASE_URL" -c "insert into users (id, handle) values ('00000000-0000-7000-8000-000000000001', 'ci-seed')"
          go run ./cmd/repose-admin db down 1
          go run ./cmd/repose-admin db status
          go run ./cmd/repose-admin db migrate
          go run ./cmd/repose-admin db verify
      # Built from source with the same toolchain go.mod pins; the prebuilt
      # action binaries lag the Go release and refuse newer go.mod versions.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: golangci-lint run ./...

  proto:
    name: buf lint and breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=main
          push: false

  nix:
    name: nix flake check (evaluate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the dev box's Nix: relative path inputs (the fragment
      # placeholder, DECISIONS I-28) are locked as "./..." entries that older
      # releases reject as unlocked.
      - uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm
      - name: evaluate every output
        run: nix flake check --no-build ./nix
      - name: build the Go binaries through the flake
        run: nix build --no-link "git+file://$GITHUB_WORKSPACE?dir=nix#guestd" "git+file://$GITHUB_WORKSPACE?dir=nix#hostd"
      # The fragment pipeline's real-Nix corpus (docs/interfaces/nix-build-contract.md
      # "Fixtures and the test corpus") and the menu's full-catalog evaluation.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: real-nix corpus
        env:
          REPOSE_NIX_TESTS: "1"
          REPOSE_NIX_NETWORK: "1"
        run: go test -run 'TestRealNix' -v ./internal/hostd/nixbuild/ ./internal/menu/
      - name: fragment contract and examples
        run: nix build --no-link ./nix#checks.x86_64-linux.fragment-contract ./nix#checks.x86_64-linux.fragment-examples
      # The agent overlay, built and pushed to the platform cache
      # (DECISIONS I-46) when the Cachix token is configured; hosts then
      # substitute the agents instead of fetching upstream.
      - name: build the agent overlay
        run: nix build --no-link ./nix#claude-code ./nix#opencode ./nix#codex ./nix#gemini-cli ./nix#pi-coding-agent ./nix#chrome-devtools-mcp ./nix#playwright-mcp
      - name: push the overlay to Cachix
        if: env.CACHIX_AUTH_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install nixpkgs#cachix
          nix build --print-out-paths --no-link ./nix#claude-code ./nix#opencode ./nix#codex ./nix#gemini-cli ./nix#pi-coding-agent ./nix#chrome-devtools-mcp ./nix#playwright-mcp             | cachix push repose

  ops:
    name: alert rules, dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          # The same pin as the nix job above, so CI runs one Nix.
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      # ops/check.sh falls back to `nix shell nixpkgs#prometheus.cli` when
      # promtool is not on PATH, which is the case here.
      - run: ops/check.sh

  web:
    name: dashboard unit + e2e tests, Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec vitest run
      - run: pnpm --filter web exec svelte-kit sync
      - run: pnpm --filter web exec svelte-check --tsconfig ./tsconfig.json
      - run: pnpm --filter web exec eslint .
      - run: pnpm --filter web build
      # The two Go fixtures (cmd/fakeapi, cmd/fake-logto) and the fake
      # Logto's own test suite (08-dashboard.md §7).
      - run: go test ./test/fake-logto/... ./internal/fakes/api/...
      - name: playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: docker build
        run: docker build -f apps/web/Dockerfile -t repose-web:ci .
      - name: image under 200 MB
        run: |
          size=$(docker image inspect repose-web:ci --format='{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 200000000
      - name: healthz on the built image
        run: |
          docker run -d --name web-ci -p 3000:3000 repose-web:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200"
          docker logs web-ci
