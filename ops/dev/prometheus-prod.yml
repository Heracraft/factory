# Prometheus for the local dev stack pointed at *production*, through the
# SSH tunnels ops/dev/tunnel-prod.sh opens. It exists so the dashboards can
# be checked against real series before the owner's Prometheus is a
# WireGuard peer, and afterwards whenever that peer is the thing being
# debugged.
#
#   ops/dev/tunnel-prod.sh <edge-ip> <control-ip> &
#   docker compose -f ops/dev/docker-compose.yml \
#     -f ops/dev/docker-compose.prod-scrape.yml up -d
#
# It is not a substitute for ops/prometheus/prometheus.yml, which is what
# the owner's server runs: that one reaches every host, this one reaches
# only what an operator can forward, and it has no file_sd, no
# Alertmanager and a short retention.
global:
  scrape_interval: 15s
  evaluation_interval: 1m
  external_labels:
    env: prod-via-tunnel
    stack: repose

rule_files:
  - /etc/prometheus/repose/alerts.yaml

scrape_configs:
  # The four endpoints tunnel-prod.sh forwards. The `instance` label is
  # rewritten to the real address so a panel and an alert read the same as
  # they would on the owner's server, rather than saying 127.0.0.1.
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:19102"]
        labels:
          role: edge
    relabel_configs:
      - target_label: instance
        replacement: "10.255.0.1:9102"

  - job_name: hosts
    static_configs:
      - targets: ["host.docker.internal:19100"]
        labels:
          host_id: edge
        # The edge's own node_exporter. It is in the `hosts` job because
        # the Host capacity dashboard groups by host_id and the edge is
        # one more machine to watch, not because the edge holds guests.
      - targets: ["host.docker.internal:19200"]
        labels:
          host_id: host-01
          region: eastus

  # hostd on host-01: every repose_host_* series (195 of them on the real
  # host). Reached through the edge, which is why the tunnel exists.
  - job_name: hostd
    static_configs:
      - targets: ["host.docker.internal:19201"]
        labels:
          host_id: host-01
          region: eastus
    relabel_configs:
      - target_label: instance
        replacement: "10.255.0.2:9101"

  # Fluent Bit's own metrics, on its own path (the FluentBitStuck alert).
  - job_name: fluent-bit
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:19202"]
        labels:
          host_id: host-01
          region: eastus
    relabel_configs:
      - target_label: instance
        replacement: "10.255.0.2:2021"

  # The tunnel reaches the api's 9103 on its container address, which is
  # a thing only an operator with SSH to the VM can do: the application
  # publishes no host port and cannot. In production the same series come
  # through the Traefik router in front of it (DECISIONS I-133); this
  # path needs neither that router nor the allow-list, which is what
  # makes it the one to reach for when the router is what is broken.
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:19103"]
        labels:
          role: control-plane
          app: api
    relabel_configs:
      - target_label: instance
        replacement: "10.255.255.1:9103"
      - target_label: app
        replacement: api

  - job_name: api-grpc
    static_configs:
      - targets: ["host.docker.internal:19104"]
        labels:
          role: control-plane
          app: api-grpc
    relabel_configs:
      - target_label: instance
        replacement: "10.255.255.1:9104"
      - target_label: app
        replacement: api-grpc
