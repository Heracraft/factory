# Prometheus for the local dev stack. It scrapes whatever repose binary is
# running on this box: hostd's :9101 if one is (`hostd run --metrics-addr
# 127.0.0.1:9101`), and itself. The real scrape config, with the hosts and the
# WireGuard addresses, is ops/prometheus/prometheus.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 1m
  external_labels:
    env: dev
    stack: repose

rule_files:
  - /etc/prometheus/repose/alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # host.docker.internal resolves to the box from inside the container on
  # Docker 20.10+ with the host-gateway alias; if it does not, the job is
  # simply down and the dashboards render empty, which is enough to check
  # that they load.
  - job_name: hostd
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          host_id: dev-host
  - job_name: hosts
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host_id: dev-host
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:9103"]
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:9102"]
