# The platform Postgres as a Coolify "Docker Compose" resource from this
# repository, with its backup to R2 (DECISIONS I-87). Coolify: Project ->
# Add resource -> Docker Compose (git), repository heracraft/repose, branch
# main, base directory `/`, compose file `/ops/coolify/postgres/docker-compose.yml`.
#
# Only the database lives here. The api, the gRPC api and the dashboard are
# each their own Coolify "Dockerfile" application, because that is what gets
# a rolling deploy and one is never redeployed for another's change; their
# env files are next to this one (ops/coolify/README.md).
#
# ${VAR:?} is a value Coolify requires before it deploys. POSTGRES_PASSWORD
# is set once as a project-level shared variable in Coolify and referenced
# here and in the api apps' DATABASE_URL, so all four agree.

services:
  postgres:
    image: postgres:16-alpine
    # A fixed name: the api applications reach it as `repose-postgres` on
    # the shared `coolify` network ("Connect to predefined network" on).
    container_name: repose-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repose
      POSTGRES_DB: repose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repose -d repose"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Nightly pg_dump (-Fc, what the runbook's pg_restore expects) into a
  # volume, pruned after 35 days. The upload is the next service; the
  # check is `repose-backup-check` on the VM (36 h limit).
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: repose
      PGDATABASE: repose
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-35}
    volumes:
      - pgbackups:/backups
      - type: bind
        source: ./backup/pg-backup.sh
        target: /usr/local/bin/pg-backup
        read_only: true
    command: ["sh", "/usr/local/bin/pg-backup", "loop"]

  # Copies new dumps to R2 every 15 minutes; never deletes there (the
  # bucket's own 35-day lifecycle rule in infra/r2 does). Credentials are
  # the R2 API token (DECISIONS I-21), set in the Environment tab.
  backup-sync:
    image: rclone/rclone:1
    restart: unless-stopped
    depends_on:
      - pg-backup
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:?}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ACL: private
      R2_BUCKET: ${R2_BUCKET:-repose-pg-backups}
    volumes:
      - pgbackups:/backups:ro
      - type: bind
        source: ./backup/backup-sync.sh
        target: /usr/local/bin/backup-sync
        read_only: true
    entrypoint: ["sh", "/usr/local/bin/backup-sync"]

volumes:
  pgdata:
  pgbackups:
