# The platform Postgres as a Coolify compose resource from this repository
# (DECISIONS I-87). Add it as a Coolify *Service* (Add resource -> Docker
# Compose Empty, paste this file), not as a git application: Coolify
# recognises the postgres image inside a Service and gives it the Backups
# tab, which is where the nightly dump to R2 is configured
# (docs/ops/coolify.md, "The Postgres backup to R2"). Coolify handles the
# backup; nothing here has to.
#
# Only the database lives here. The api, the gRPC api and the dashboard are
# each their own Coolify "Dockerfile" application, because that is what gets
# a rolling deploy and one is never redeployed for another's change; their
# env files are next to this one (ops/coolify/README.md).
#
# POSTGRES_PASSWORD is set once as a project-level shared variable in
# Coolify and referenced here and in the api apps' DATABASE_URL, so all
# four agree.

services:
  postgres:
    image: postgres:16-alpine
    # A fixed name: the api applications reach it as `repose-postgres` on
    # the shared `coolify` network ("Connect to predefined network" on).
    container_name: repose-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repose
      POSTGRES_DB: repose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repose -d repose"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
