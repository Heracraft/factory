# The platform Postgres as a Coolify compose resource from this repository
# (DECISIONS I-87). Add it as a Coolify *Service* (Add resource -> Docker
# Compose Empty, paste this file), not as a git application: Coolify
# recognises the postgres image inside a Service and gives it the Backups
# tab, which is where the nightly dump to R2 is configured
# (docs/ops/coolify.md, "The Postgres backup to R2"). Coolify handles the
# backup; nothing here has to.
#
# Only the database lives here. The api, the gRPC api and the dashboard are
# each their own Coolify "Dockerfile" application, because that is what gets
# a rolling deploy and one is never redeployed for another's change; their
# env files are next to this one (ops/coolify/README.md).
#
# POSTGRES_PASSWORD is set once as a project-level shared variable in
# Coolify and referenced here and in the api apps' DATABASE_URL, so all
# four agree.

services:
  # The service name is the hostname the api applications use, and this
  # file joins the shared `coolify` network itself so that name is
  # registered there: Docker aliases a service by its name on every network
  # the compose file puts it on, and Coolify's serviceParser passes a
  # service's own `networks:` map through unchanged (it only appends its
  # per-resource network). The "Connect to predefined network" toggle is
  # the wrong tool for this: it connects the container after `compose up`,
  # which registers the container name and nothing else, so the bare
  # service name did not resolve and the first api deploy failed
  # (docs/ops/coolify.md fact 11, DECISIONS I-89). Leave that toggle off.
  # `container_name` would be overwritten with <service>-<uuid>; nothing
  # relies on it.
  repose-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repose
      POSTGRES_DB: repose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repose -d repose"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      coolify:
        # Redundant with the service name, kept so the intent is in the file.
        aliases:
          - repose-postgres

networks:
  coolify:
    name: coolify
    external: true

volumes:
  pgdata:
