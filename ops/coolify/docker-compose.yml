# The repose control plane as one Coolify "Docker Compose" resource, from
# this repository (DECISIONS I-87). Coolify: Projects -> Add resource ->
# Docker Compose (git), repository heracraft/repose, branch main, base
# directory `/`, compose file `ops/coolify/docker-compose.yml`. Everything
# else it needs is in this file or in the resource's Environment tab; see
# ops/coolify/README.md for the exact values and the two domains.
#
# ${VAR:?} is a value Coolify requires before it deploys; ${VAR:-x} starts
# as x and is editable there. SERVICE_* names are generated by Coolify.
#
# What this trades away, on purpose, until launch: Coolify's rolling
# deploy (a compose deploy recreates the changed services, a few seconds
# of 503 on the api and dashboard) and its managed-database backup UI
# (replaced by the pg-backup and backup-sync services below, whose result
# `repose-backup-check` on the VM verifies).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repose
      POSTGRES_DB: repose
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repose -d repose"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The HTTP api: the CLI and the dashboard. Runs the migrations first
  # (-migrate), so api-grpc below starts against the new schema.
  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
      args:
        VERSION: ${SOURCE_COMMIT:-dev}
    image: repose-api:${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    command: ["-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_FQDN_API_8080: ""
      API_MODE: http
      API_LISTEN: ":8080"
      API_METRICS_LISTEN: ":9103"
      DATABASE_URL: postgres://repose:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/repose?sslmode=disable
      LOGTO_ISSUER: ${LOGTO_ISSUER:-https://accounts.herakraft.co}
      LOGTO_M2M_CLIENT_ID: ${LOGTO_M2M_CLIENT_ID:?}
      LOGTO_M2M_CLIENT_SECRET: ${LOGTO_M2M_CLIENT_SECRET:?}
      API_RESOURCE: ${API_RESOURCE:-https://api.repose.herakraft.co}
      KEYVAULT_URL: ${KEYVAULT_URL:-https://repose-kv-3912.vault.azure.net/}
      KEYVAULT_KEY_NAME: ${KEYVAULT_KEY_NAME:-repose-dek-wrap}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?}
      BLOB_ACCOUNT_URL: ${BLOB_ACCOUNT_URL:-https://reposesnapshots3912.blob.core.windows.net/}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-repose-snapshots}
      GATEWAY_HOST: ${GATEWAY_HOST:-ssh.repose.herakraft.co}
      GATEWAY_PORT: ${GATEWAY_PORT:-22}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://repose.herakraft.co}
      NOTIFY_FROM: ${NOTIFY_FROM:-repose <notify@repose.herakraft.co>}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Billing (09): with STRIPE_SECRET_KEY empty every /billing route
      # answers 503 billing_disabled and usage still accrues.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_COMPUTE: ${STRIPE_PRICE_COMPUTE}
      STRIPE_PRICE_STORAGE: ${STRIPE_PRICE_STORAGE}
      STRIPE_PRICE_EGRESS: ${STRIPE_PRICE_EGRESS}
      STRIPE_METER_ID_COMPUTE: ${STRIPE_METER_ID_COMPUTE}
      STRIPE_METER_ID_STORAGE: ${STRIPE_METER_ID_STORAGE}
      STRIPE_METER_ID_EGRESS: ${STRIPE_METER_ID_EGRESS}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-true}
      BILLING_ENFORCE: ${BILLING_ENFORCE:-true}
    ports:
      # Prometheus on the owner's server scrapes this over WireGuard; the
      # control NSG never opens it on the public IP.
      - "9103:9103"
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The gRPC api: hosts (hostd) on 8443 and the gateway's /internal on
  # 8444, both over mTLS from the CA in Postgres (I-42). The server
  # certificate is issued from that CA at start for GRPC_SERVER_NAMES
  # (I-87); hosts reach it over WireGuard at 10.255.255.1 with
  # apiServerName set to the first name.
  api-grpc:
    image: repose-api:${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_MODE: grpc
      API_GRPC_LISTEN: ":8443"
      API_INTERNAL_LISTEN: ":8444"
      API_METRICS_LISTEN: ":9103"
      GRPC_SERVER_NAMES: ${GRPC_SERVER_NAMES:-api.repose.herakraft.co}
      DATABASE_URL: postgres://repose:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/repose?sslmode=disable
      KEYVAULT_URL: ${KEYVAULT_URL:-https://repose-kv-3912.vault.azure.net/}
      KEYVAULT_KEY_NAME: ${KEYVAULT_KEY_NAME:-repose-dek-wrap}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?}
      BLOB_ACCOUNT_URL: ${BLOB_ACCOUNT_URL:-https://reposesnapshots3912.blob.core.windows.net/}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-repose-snapshots}
      GATEWAY_HOST: ${GATEWAY_HOST:-ssh.repose.herakraft.co}
      GATEWAY_PORT: ${GATEWAY_PORT:-22}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://repose.herakraft.co}
      NOTIFY_FROM: ${NOTIFY_FROM:-repose <notify@repose.herakraft.co>}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_COMPUTE: ${STRIPE_PRICE_COMPUTE}
      STRIPE_PRICE_STORAGE: ${STRIPE_PRICE_STORAGE}
      STRIPE_PRICE_EGRESS: ${STRIPE_PRICE_EGRESS}
      STRIPE_METER_ID_COMPUTE: ${STRIPE_METER_ID_COMPUTE}
      STRIPE_METER_ID_STORAGE: ${STRIPE_METER_ID_STORAGE}
      STRIPE_METER_ID_EGRESS: ${STRIPE_METER_ID_EGRESS}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-true}
      BILLING_ENFORCE: ${BILLING_ENFORCE:-true}
    ports:
      - "8443:8443"
      - "8444:8444"
      - "9104:9103"
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The dashboard. PUBLIC_* are read at runtime (apps/web/Dockerfile), so
  # they are plain environment here, no rebuild to change them.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WEB_3000: ""
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.repose.herakraft.co/v1}
      PUBLIC_LOGTO_ENDPOINT: ${PUBLIC_LOGTO_ENDPOINT:-https://accounts.herakraft.co}
      PUBLIC_LOGTO_APP_ID: ${PUBLIC_LOGTO_APP_ID:?}
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${PUBLIC_STRIPE_PUBLISHABLE_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Nightly pg_dump (-Fc, what the runbook's pg_restore expects) into a
  # volume, pruned after 35 days. The upload is the next service; the
  # check is `repose-backup-check` on the VM (36 h limit).
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: repose
      PGDATABASE: repose
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-35}
    volumes:
      - pgbackups:/backups
      - type: bind
        source: ./backup/pg-backup.sh
        target: /usr/local/bin/pg-backup
        read_only: true
    command: ["sh", "/usr/local/bin/pg-backup", "loop"]

  # Copies new dumps to R2 every 15 minutes; never deletes there (the
  # bucket's own 35-day lifecycle rule in infra/r2 does). Credentials are
  # the R2 API token (DECISIONS I-21), set in the Environment tab.
  backup-sync:
    image: rclone/rclone:1
    restart: unless-stopped
    depends_on:
      - pg-backup
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:?}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ACL: private
      R2_BUCKET: ${R2_BUCKET:-repose-pg-backups}
    volumes:
      - pgbackups:/backups:ro
      - type: bind
        source: ./backup/backup-sync.sh
        target: /usr/local/bin/backup-sync
        read_only: true
    entrypoint: ["sh", "/usr/local/bin/backup-sync"]

volumes:
  pgdata:
  pgbackups:
