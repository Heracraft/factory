# The WireGuard peer that lets the personal Grafana server scrape repose.
#
# Prometheus lives outside Azure, and hosts have no inbound (DESIGN §7), so
# the monitoring server joins the edge's hub as one more peer and reaches
# every host through it. This is the only reason that server is on the mesh:
# it scrapes, it receives logs from Fluent Bit, and it originates nothing
# else.
#
# Two halves. On the monitoring server, /etc/wireguard/repose.conf:

[Interface]
# Allocated from the edge's 10.255.0.0/16 pool; .3 is the monitoring server
# by convention (.1 edge, .2 Coolify VM, .4 and up hosts).
Address = 10.255.0.3/16
PrivateKey = <the monitoring server's private key; never in this repository>
# No ListenPort: it dials out, like every other peer.

[Peer]
# The edge, which routes to every host's WireGuard address and to each
# host's guest /22.
PublicKey = <the edge's public key, from `wg show wg0 public-key` on the edge>
Endpoint = ssh.repose.herakraft.co:51820
AllowedIPs = 10.255.0.0/16, 10.64.0.0/12
PersistentKeepalive = 25

# And on the edge, the matching peer (workstream 06 owns nix/edge; add it
# there as a declared peer, never with a live `wg set`, or the next
# nixos-rebuild removes it):
#
#   repose.edge.wireguard.peers = [{
#     name = "monitoring";
#     publicKey = "<the monitoring server's public key>";
#     allowedIPs = [ "10.255.0.3/32" ];
#   }];
#
# The edge's firewall needs nothing new: the hub already listens on
# 51820/udp for hosts, and the monitoring server's traffic is outbound from
# its side.
#
# What the hosts need: the nftables input chain admits tcp 22, 9100, 9101 and
# the Fluent Bit metrics port from wg0 only
# (docs/interfaces/host-conventions.md). A scrape from 10.255.0.3 arrives on
# wg0, so nothing per-peer is needed there either.
#
# Verifying it, from the monitoring server:
#
#   wg show repose                       # a handshake with the edge
#   curl -s http://10.255.0.7:9100/metrics | head -1
#   curl -s http://10.255.0.7:9101/metrics | grep repose_host_
#   curl -s http://10.255.0.1:9102/metrics | grep repose_gateway_
#
# If the first works and the second does not, the edge is not advertising
# that host's address: check `wg show wg0 allowed-ips` on the edge, which
# wgsync fills from GET /internal/hosts (DECISIONS I-4).
