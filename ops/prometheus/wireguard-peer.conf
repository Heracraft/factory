# The WireGuard peer that lets the personal Grafana server scrape repose.
#
# Prometheus lives outside Azure, and hosts have no inbound (DESIGN §7), so
# the monitoring server joins the edge's hub as one more peer and reaches
# every host through it. This is the only reason that server is on the mesh:
# it scrapes, it receives logs from Fluent Bit, and it originates nothing
# else.
#
# Three halves, not two: the peer on the monitoring server, the peer on the
# edge, and — the one an earlier version of this file said was unnecessary —
# the edge's forward chain, because every scrape is a packet the edge
# *forwards* from one peer to another and the chain's policy is drop.
#
# Addresses on the hub, as built: .1 the edge (`repose.edge.wgAddress`),
# hosts from .2 upward as the api's allocator hands them out (host-01 is
# 10.255.0.2, not the .4-and-up an earlier draft of this file assumed),
# and .3 for the monitoring server only because nothing has claimed it —
# pick one outside the allocator's range if the fleet grows. A host's own
# address comes from its host.json (WG_ADDR in /run/repose/host.env). The
# control plane is **10.255.255.1**, not .2 (DECISIONS I-92); this file
# used to say .2 and ops/prometheus/prometheus.yml scraped that address,
# which answers nothing.
#
# 1. On the monitoring server, /etc/wireguard/repose.conf:

[Interface]
Address = 10.255.0.3/16
PrivateKey = <the monitoring server's private key; never in this repository>
# No ListenPort: it dials out, like every other peer.

[Peer]
# The edge, which routes to every host's WireGuard address, to the control
# plane's, and to each host's guest /22.
PublicKey = <the edge's public key, from `wg show wg0 public-key` on the edge>
Endpoint = ssh.repose.herakraft.co:51820
AllowedIPs = 10.255.0.0/16, 10.64.0.0/12
PersistentKeepalive = 25

# 2. On the edge, the matching peer (workstream 06 owns nix/edge; add it
#    there as a declared peer, never with a live `wg set`, or the next
#    nixos-rebuild removes it). `staticPeers` is the list wgsync is told to
#    keep, so its reconciler does not tear the peer down 30 seconds later:
#
#      repose.edge.staticPeers = [{
#        publicKey = "<the monitoring server's public key>";
#        allowedIPs = [ "10.255.0.3/32" ];
#      }];
#
# 3. And the forward chain, in the same file:
#
#      repose.edge.monitoring.peerCIDRs = [ "10.255.0.3/32" ];
#
#    That adds exactly two rules: the monitoring peer may reach 9100,
#    9101, 2021, 9104 and 443 on another peer (443 is the control
#    plane's Traefik, which serves the api's /metrics, I-133), and
#    another peer may reach 3100 on
#    it. Everything else between peers stays dropped, which is what keeps
#    one host from reaching another through the hub. Without it the tunnel
#    comes up, `wg show` looks perfect, and every scrape times out — the
#    edge's forward chain was `ct state established,related accept` and a
#    drop, and a scrape is neither.
#
# What the hosts need: their nftables input chain already admits tcp 22,
# 9100, 9101 and the Fluent Bit metrics port from wg0 only
# (docs/interfaces/host-conventions.md), and a scrape from 10.255.0.3
# arrives on wg0, so nothing per-peer is needed there.
#
# 4. The control plane, which is reached two ways. `api-grpc` publishes
#    9104 and is scraped on the tunnel address directly. `api` publishes
#    nothing — a host port would cost it its rolling deploys — so its
#    /metrics comes through the Traefik router in front of it, behind an
#    IP allow-list (DECISIONS I-133). That router matches on the `Host`
#    header, so the scrape has to use the *name*, and the name has to
#    resolve to the tunnel rather than to the public IP. One line on the
#    monitoring server, in /etc/hosts:
#
#      10.255.255.1  api.repose.herakraft.co
#
#    With it, the Host header, the SNI and the certificate are all the
#    real ones and the packet still goes over WireGuard. Without it the
#    scrape works — over the internet, from an address the allow-list
#    should refuse, which is a 403 rather than a silent leak, but it is
#    not the path this file exists to build.
#
# Verifying it, from the monitoring server:
#
#   wg show repose                                    # a handshake with the edge
#   curl -s http://10.255.0.1:9102/metrics | grep repose_gateway_
#   curl -s http://10.255.0.2:9100/metrics | head -1
#   curl -s http://10.255.0.2:9101/metrics | grep repose_host_
#   curl -s http://10.255.0.2:2021/api/v1/metrics/prometheus | head -1
#   curl -s http://10.255.255.1:9104/metrics | grep repose_api_
#
# If the handshake works and every curl hangs, it is step 3. If one host
# answers and another does not, the edge is not advertising that host's
# address: check `wg show wg0 allowed-ips` on the edge, which wgsync fills
# from GET /internal/hosts (DECISIONS I-4).
